<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语方位词互动</title><style>@font-face{font-family:YaHei;src:url('../../yahei-regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#f6f9fa;color:#203c54;font-family:YaHei,'Microsoft YaHei',sans-serif}main{max-width:900px;margin:auto;padding:30px 22px}h1{font-size:34px;line-height:1.3;margin:14px 0}p{font-size:17px;line-height:1.9;color:#5e7586}.kicker{color:#e34c42;font-weight:bold;font-size:15px}.scene{margin:22px 0;background:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 40px #2447630d}.scene svg{width:100%;height:auto;display:block}button{font:inherit;font-size:18px;padding:16px 20px;border:1px solid #d7e2e5;border-radius:13px;background:white;color:#24465a;cursor:pointer;min-height:52px}.options{display:flex;gap:12px;flex-wrap:wrap}.options button{flex:1 1 180px}button:hover,button.active{border-color:#289a87;background:#eaf7f3}#feedback{min-height:60px;font-weight:bold;color:#177c69}.note{font-size:13px}.progress{font-size:15px;color:#177c69}@media(max-width:500px){h1{font-size:28px}main{padding:22px 16px}.scene{padding:12px}}</style><body><main><span class="kicker">英语互动作品 · 体验示例</span><h1>用英语说清方位</h1><p>用一个具体场景理解方位词，再选择合适的表达。</p><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350"><rect x="40" y="45" width="680" height="270" rx="18" fill="#f0f8f8"/><path d="M150 265V160l150-95 150 95v105z" fill="#79beb1"/><rect x="270" y="170" width="60" height="95" fill="#fff"/><path d="M500 265V135h150v130z" fill="#6d9fce"/><g font-family="YaHei,Microsoft YaHei,sans-serif" font-size="27" fill="#183c53"><text x="205" y="310">School</text><text x="515" y="310">Library</text></g></svg></div><span class="progress">第1题  描述图中位置</span><h2>The library is ___ the school.</h2><div class="options"><button data-answer="up">next to</button><button data-answer="down">under</button></div><p id="feedback" role="status">选一个答案，看看你的判断。</p><button id="reset">重新作答</button><p class="note">该程序为作品投稿体验样例。作答仅在当前页面显示，不记录真实学生成绩。</p></main><script>document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-answer]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('feedback').textContent=b.dataset.answer==='up'?'回答正确。next to 表示在旁边。':'再看看图。Library在School旁边，可以用next to表达。'});document.getElementById('reset').onclick=()=>{document.querySelectorAll('[data-answer]').forEach(b=>b.classList.remove('active'));document.getElementById('feedback').textContent='选一个答案，看看你的判断。'};</script></body></html>
