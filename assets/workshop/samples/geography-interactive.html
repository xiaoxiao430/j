<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>等高线互动读图</title><style>@font-face{font-family:YaHei;src:url('../../yahei-regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#f6f9fa;color:#203c54;font-family:YaHei,'Microsoft YaHei',sans-serif}main{max-width:900px;margin:auto;padding:30px 22px}h1{font-size:34px;line-height:1.3;margin:14px 0}p{font-size:17px;line-height:1.9;color:#5e7586}.kicker{color:#e34c42;font-weight:bold;font-size:15px}.scene{margin:22px 0;background:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 40px #2447630d}.scene svg{width:100%;height:auto;display:block}button{font:inherit;font-size:18px;padding:16px 20px;border:1px solid #d7e2e5;border-radius:13px;background:white;color:#24465a;cursor:pointer;min-height:52px}.options{display:flex;gap:12px;flex-wrap:wrap}.options button{flex:1 1 180px}button:hover,button.active{border-color:#289a87;background:#eaf7f3}#feedback{min-height:60px;font-weight:bold;color:#177c69}.note{font-size:13px}.progress{font-size:15px;color:#177c69}@media(max-width:500px){h1{font-size:28px}main{padding:22px 16px}.scene{padding:12px}}</style><body><main><span class="kicker">地理互动作品 · 体验示例</span><h1>读懂一座山的高度</h1><p>观察等高线，先找A点和B点，再选择你的判断。</p><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="等高线示意图"><rect width="760" height="350" fill="#f9fcfb"/><g fill="none" stroke="#279780" stroke-width="3"><ellipse cx="378" cy="180" rx="326" ry="145"/><ellipse cx="391" cy="180" rx="234" ry="105"/><ellipse cx="405" cy="180" rx="145" ry="65"/></g><g fill="#1b7868" font-size="24" font-family="YaHei,Microsoft YaHei,sans-serif"><text x="615" y="270">100米</text><text x="540" y="235">200米</text><text x="454" y="207">300米</text></g><g fill="#e44a40"><circle cx="52" cy="180" r="7"/><circle cx="405" cy="115" r="7"/></g><g fill="#bd3029" font-size="26" font-family="YaHei,Microsoft YaHei,sans-serif"><text x="45" y="162">A</text><text x="411" y="103">B</text></g></svg></div><span class="progress">第1题  从A点走向B点</span><h2>海拔总体怎样变化？</h2><div class="options"><button data-answer="up">逐渐升高</button><button data-answer="down">逐渐降低</button></div><p id="feedback" role="status">选一个答案，看看你的判断。</p><button id="reset">重新作答</button><p class="note">该程序为作品投稿体验样例。作答仅在当前页面显示，不记录真实学生成绩。</p></main><script>document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-answer]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('feedback').textContent=b.dataset.answer==='up'?'判断正确。A点为100米，B点为300米，海拔上升200米。':'再看一看标注：从外圈100米走向内圈300米，海拔升高。'});document.getElementById('reset').onclick=()=>{document.querySelectorAll('[data-answer]').forEach(b=>b.classList.remove('active'));document.getElementById('feedback').textContent='选一个答案，看看你的判断。'};</script></body></html>
